  join_rule_read_from: "pt2_llm/data.py@9e943e6 line: testenc = tokenizer('\\n\\n'.join(testdata['text']), return_tensors='pt')"
  encoding: "utf-8"

  # --- filled by pin_slice.py. UNPINNED until it has run. ---
  sha256_joined_text: "696cca6b65a171b0a358a4be6732cdfdf2dd6164a32e20fd70e3c13fc4dfae83"
  sha256_evaluated_bytes: "70a209ab2213ab3302b7ad1ded8354eb6f6b0845e330c795e0a300ac370ed8e4"
  joined_text_bytes_total: 1296370
  byte_range_evaluated: "[0, 1296016) of 1296370 bytes -- the prefix spanned by the 299008 tokens of the 146 complete windows; the trailing 70 tokens are dropped by the method's own eval loop"
  n_tokens_total: 299078
  n_windows: 146
  n_tokens_evaluated: 299008
  n_target_tokens: 298862
  bytes_of_target_region: 1295360
  bos_handling_verified: "VERIFIED: add_special_tokens=True does NOT prepend BOS (first token id 271, bos_token_id None, first offset (0, 2)). No per-window BOS is inserted anywhere: the stream is tokenized once and sliced."

  tokenizer_repo_id: "Qwen/Qwen2.5-1.5B"
  tokenizer_revision_sha: "8faed761d45a263340a0528343f099c05c9a4323"
  tokenizer_use_fast_in_method: false
  tokenizer_fast_slow_parity_check: "REQUIRED -- pin_slice.py uses the FAST tokenizer (offset mapping is needed for byte accounting) and asserts token-id equality against the SLOW tokenizer, which is what the method's data.py constructs (use_fast=False). A mismatch is a BLOCK, recorded here."
  tokenizer_fast_slow_parity_result: "PASS: fast and slow tokenizers produce IDENTICAL ids on the first 200000 chars (47640 tokens). The method builds its tokenizer with use_fast=False; this script uses the fast one only because offset mapping requires it."

  context_length: 2048
  stride: 2048
  stride_note: "NON-OVERLAPPING. Read from pt2_llm/eval_ppl.py@9e943e6: windows are testenc[:, i*seqlen : (i+1)*seqlen]. Stride == context. This is the GPTQ-lineage convention and it is what every published anchor number was produced under."
  tail_handling: "DROPPED. nsamples = testenc.numel() // seqlen -- the trailing partial window is discarded. Read from eval_ppl.py@9e943e6."
  bos_handling: "NONE inserted per window. The whole joined string is tokenized ONCE with the tokenizer's default add_special_tokens; windows are slices of that single stream, so no window except possibly the first can carry a BOS. Qwen2 does not prepend BOS (see donor.tokenizer_adds_bos_by_default). Read from eval_ppl.py@9e943e6 + data.py@9e943e6."
  first_token_of_window: "UNSCORED. shift_logits = logits[:, :-1], shift_labels = window[:, 1:] -- 2047 targets per 2048-token window."
  loss_reduction: "nn.CrossEntropyLoss() default reduction='mean' over the 2047 targets of a window; the per-window mean is then multiplied by seqlen=2048 and the sum divided by nsamples*seqlen, so the 2048 factors CANCEL. Net: PPL = exp(mean over windows of (mean CE over that window's 2047 targets)). This is an UNWEIGHTED MEAN OVER WINDOWS, not a token-weighted mean -- they coincide here only because every window has exactly 2047 targets. Read from eval_ppl.py@9e943e6."
  bpb_reduction: "BPB = (sum over all target tokens of CE in bits) / (bytes spanned by those target tokens). Token-weighted, NOT a mean of per-window BPBs. Accumulated in fp32 always, regardless of weight dtype."
  bpb_vs_ppl_note: "The harness emits BOTH PPL (the anchors' unit, under the method's exact reduction above) and BPB (the gate's unit). The two use DIFFERENT reductions and that is deliberate and recorded; a single run produces both from the same per-token CE tensor."

