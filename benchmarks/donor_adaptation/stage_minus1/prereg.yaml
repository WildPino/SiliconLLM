  arxiv_id: "2510.03267"
  venue_claim: "ICLR 2026"
  repo_url: "https://github.com/XIANGLONGYAN/PT2-LLM"
  repo_commit_sha: "9e943e68bdb27469929a4fe7e5720926b9d952d7"
  repo_commit_date: "2026-07-09T12:45:56Z"
  repo_commit_message: "Release PT2-LLM post-training ternarization code"
  repo_licence: "Apache-2.0"
  repo_read_from: "GitHub API /repos/XIANGLONGYAN/PT2-LLM + /commits (code IS released; the survey's 'will be available' note is stale)"
  gradient_free: true
  gradient_free_evidence: >-
    Read from pt2_llm/quantizer.py@9e943e6 and pt2_llm/gptq.py@9e943e6: the ternary fit is an
    alternating closed-form solve (solve_closed_form_alpha_mu) inside `@torch.no_grad()`, with a
    <=100-iteration fixed-point loop that early-stops on ternary-code equality. No optimizer, no
    loss.backward(), no learning rate anywhere in the quantization path. GENUINELY GRADIENT-FREE
    (contrast TWLA arXiv 2606.13054, which is 100 gradient iterations at lr 0.01 and is therefore
    S1-forbidden as a primary-path method).
