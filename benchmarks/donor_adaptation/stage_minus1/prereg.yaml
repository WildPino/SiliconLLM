  paper_calibration_seqlen: 2048
  paper_calibration_corpus: "WikiText-2-raw-v1 TRAIN split"
  paper_calibration_read_from: "quantize.py@9e943e6 --nsamples default 128, --calib_seqlen default 2048; pt2_llm/data.py get_wikitext2() samples 128 random 2048-token windows from ' '.join(train['text']) at --seed default 0"
  paper_reported_cost: "32 min for LLaMA-7B on one A800-80GB (paper Table 3)"
  reference_command:
    read_from: "bash/quantize.sh@9e943e6"
    line: "python quantize.py $MODEL wikitext2 atq --blocksize 128 --ssr --save"
  method_pinned_hyperparameters:
    low_quant_method: "atq"
    ssr: true
    blocksize: 128
    percdamp: 0.01
    num_p: 1
    salient_metric: "hessian"
    order2_group: false
    disable_gptq: false
    seed: 0
    nsamples: 128
    calib_seqlen: 2048
    ppl_seqlen: 2048
    read_from: "quantize.py@9e943e6 argparse defaults + bash/quantize.sh@9e943e6"
  method_declared_dependency_pins:
