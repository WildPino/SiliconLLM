    compares against (PT^2-LLM Table 1, TWLA Table 1, QuaRot/GPTQ). Choosing any other slice makes
    the anchors unusable and re-opens B1 in a new coordinate. The exact join, context, stride, tail
    handling and loss reduction below are READ FROM the method's own eval_ppl.py, not chosen by the
    Builder -- so control 1a/1b compare like with like.
  corpus_id: "wikitext"
  corpus_config: "wikitext-2-raw-v1"
  corpus_split: "test"
  corpus_repo_type: "dataset"
  corpus_revision_sha: "b08601e04326c79dfdd32d625aee71d232d685c3"
