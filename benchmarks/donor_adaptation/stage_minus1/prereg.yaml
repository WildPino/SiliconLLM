  decontamination_result_vs_calibration: "MEASURED: 1/80995 eval shingles (0.0012%) also occur in the calibration source (wikitext-2-raw-v1 TRAIN, ' '.join, same pinned revision). Splits are disjoint by construction; this measures the residual boilerplate overlap."
  decontamination_result_vs_p62_codeval: "MEASURED: 0/80995 eval shingles (0.0000%) also occur in the pinned P62 code-val (D:/_THINGS/Progetti/SiliconLLM/results/phase62/code_val.txt, 1500000 bytes)."

