name: CI

# Builds the C engine stages and the kernel microbenchmarks, and runs the
# weight-free LUT self-test (bit-exactness). The full engine parity gates need
# the release asset (see docs/REPRODUCE.md) and are not run here.

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build-and-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      # Portable AVX2 (x86-64-v3) so it runs on any GitHub x86 runner, not just Zen 2.
      - name: Build engines + microbenchmarks
        run: make ARCH=-march=x86-64-v3

      - name: Kernel self-test (LUT bit-exactness)
        run: make test ARCH=-march=x86-64-v3
